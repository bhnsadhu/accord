name: Production availability
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
concurrency:
  group: production-monitor
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/ops/monitor.mjs
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
